name: Build SaltBee

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SaltBee-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    continue-on-error: true   # the Windows .exe is the primary deliverable
    steps:
      - uses: actions/checkout@v4
      # AppImage packaging needs FUSE 2, which isn't on the runner image by default
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 fuse
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SaltBee-linux
          path: release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Only gate on Windows: the Linux AppImage job is allowed to fail (the
    # runner lacks FUSE) and must not block publishing the .exe.
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
